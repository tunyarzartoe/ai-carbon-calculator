<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CO2 Compass | カーボン診断AI</title>
    <meta name="theme-color" content="#0A0F0D">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CO2 Compass">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Crect%20width='48'%20height='48'%20rx='10'%20fill='%230A0F0D'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='17'%20fill='none'%20stroke='%2322322C'%20stroke-width='2'/%3E%3Cpath%20d='M24%206%20C30%2011%2030%2020%2024%2024%20C18%2020%2018%2011%2024%206%20Z'%20fill='%233DFFB0'/%3E%3Cpolygon%20points='24,42%2028,24%2024,24%2020,24'%20fill='%2333C7E8'%20opacity='0.6'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='2.6'%20fill='%230A0F0D'%20stroke='%23E7F5EF'%20stroke-width='1.2'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reminder.css">
</head>

<body>

    <div class="app">
        <header class="app-header">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                    <circle cx="24" cy="24" r="17" fill="none" stroke="var(--border)" stroke-width="2" />
                    <path d="M24 6 C30 11 30 20 24 24 C18 20 18 11 24 6 Z" fill="var(--mint)" />
                    <polygon points="24,42 28,24 24,24 20,24" fill="var(--cyan)" opacity="0.6" />
                    <circle cx="24" cy="24" r="2.6" fill="var(--bg-panel)" stroke="var(--text-hi)" stroke-width="1.2" />
                </svg>
                <div>
                    <span class="brand-tag">ECO / AI</span>
                    <h1 class="brand-title">CO<sub>2</sub> Compass</h1>
                </div>
            </div>
            <div class="header-right">
                <span id="levelBadge" class="level-badge">Lv.1</span>
                <div class="gauge-wrap" aria-label="本日の推定CO2排出量">
                    <svg class="gauge" viewBox="0 0 120 120">
                        <circle class="gauge-track" cx="60" cy="60" r="52"></circle>
                        <circle id="gaugeFill" class="gauge-fill" cx="60" cy="60" r="52"></circle>
                    </svg>
                    <div class="gauge-readout">
                        <span id="gaugeValue">0.0</span>
                        <span class="gauge-unit">kg CO2 / 日</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- ===== 💬 チャット PAGE（診断のQ&A。既定で表示） ===== -->
        <div id="chatPage" class="app-page active">
            <main id="chatLog" class="chat-log" aria-live="polite"></main>
            <footer class="reply-dock">
                <div id="replyOptions" class="reply-options"></div>
            </footer>
        </div>

        <!-- ===== 🗓️ 履歴 PAGE ===== -->
        <div id="historyPage" class="app-page">
            <div class="page-scroll">
                <div class="page-head-row">
                    <button id="calPrev" class="cal-nav" aria-label="前の月" type="button">‹</button>
                    <span id="calMonthLabel" class="page-head-label">-</span>
                    <button id="calNext" class="cal-nav" aria-label="次の月" type="button">›</button>
                </div>
                <div id="calendarSummary" class="calendar-summary"></div>
                <div id="monthlyGoalCard" class="monthly-goal-card-wrap"></div>
                <div id="calendarTrend" class="calendar-trend"></div>
                <div class="calendar-weekdays">
                    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
                <div id="calendarDetail" class="calendar-detail"></div>
            </div>
        </div>

        <!-- ===== 🏆 ランキング PAGE ===== -->
        <div id="rankingPage" class="app-page">
            <div class="page-scroll">
                <h2 class="page-title">🏆 自己ランキング</h2>
                <p class="ranking-subtitle">CO2が少なかった日ランキング（過去の自分と比較）</p>
                <div id="rankingList" class="ranking-list"></div>
            </div>
        </div>

        <!-- ===== 🎓 認定証・バッジ PAGE ===== -->
        <div id="achievementsPage" class="app-page">
            <div class="achievements-subtabs" role="tablist">
                    <button type="button" class="subtab-btn active" id="achSubtabCert" data-panel="achPanelCert">証明書</button>
                    <button type="button" class="subtab-btn" id="achSubtabBadges" data-panel="achPanelBadges">バッジ</button>
                    <button type="button" class="subtab-btn" id="achSubtabSettings" data-panel="achPanelSettings">設定</button>
            </div>
            <div class="page-scroll">
                <div id="achPanelCert" class="achievements-panel active">
                    <div id="growthTreeCard" class="growth-tree-card"></div>
                    <div class="cert-name-field">
                        <label for="certNameInput">証明書に表示するお名前（任意）</label>
                        <input id="certNameInput" type="text" maxlength="20" placeholder="ニックネームなど">
                    </div>
                    <div id="certificateCard" class="certificate-card"></div>
                    <div class="certificate-actions">
                        <button id="certShareBtn" class="reply-btn" type="button">
                            <span class="btn-icon">📤</span><span class="btn-text">シェア</span>
                        </button>
                        <button id="certDownloadBtn" class="reply-btn" type="button">
                            <span class="btn-icon">⬇️</span><span class="btn-text">画像を保存</span>
                        </button>
                    </div>
                </div>

                <div id="achPanelBadges" class="achievements-panel">
                    <div id="weeklyChallengeCard" class="weekly-challenge-card"></div>
                    <h3 class="badges-heading">獲得バッジ</h3>
                    <div id="badgesGrid" class="badges-grid"></div>
                </div>

                <div id="achPanelSettings" class="achievements-panel">
                    <div class="data-manage">
                        <h3 class="data-manage-heading">📦 データ管理</h3>
                        <p class="data-manage-note">記録はこの端末のブラウザだけに保存されているよ。機種変更やブラウザのデータ削除に備えて、バックアップを保存しておこう。</p>
                        <div class="data-manage-actions">
                            <button id="exportDataBtn" class="reply-btn" type="button">
                                <span class="btn-icon">💾</span><span class="btn-text">バックアップを保存</span>
                            </button>
                            <button id="importDataBtn" class="reply-btn" type="button">
                                <span class="btn-icon">📂</span><span class="btn-text">復元する</span>
                            </button>
                        </div>
                        <input type="file" id="importFileInput" accept="application/json" hidden>
                    </div>

                    <div class="data-manage">
                        <h3 class="data-manage-heading">📍 通学・通勤距離</h3>
                        <p class="data-manage-note" id="commuteStatusNote"></p>
                        <div class="data-manage-actions">
                            <button id="resetCommuteBtn" class="reply-btn" type="button">
                                <span class="btn-icon">📍</span><span class="btn-text">距離をリセット</span>
                            </button>
                        </div>
                    </div>

                    <div class="data-manage">
                        <div class="reminder-toggle-row">
                            <div>
                                <h3 class="data-manage-heading">🔔 記録リマインダー</h3>
                                <p class="data-manage-note">設定した時刻までにその日の記録がないと、通知でお知らせするよ。</p>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="reminderToggle">
                                <span class="switch-track"><span class="switch-thumb"></span></span>
                            </label>
                        </div>

                        <div class="reminder-settings" id="reminderSettings">
                            <div class="reminder-row">
                                <span class="reminder-row-label">時刻</span>
                                <input id="reminderTimeInput" type="time" value="20:00" class="reminder-time-input">
                            </div>
                            <div class="reminder-row reminder-row-days">
                                <span class="reminder-row-label">曜日</span>
                                <div class="reminder-day-chips">
                                    <button type="button" class="reminder-day-chip" data-day="0" aria-pressed="true">日</button>
                                    <button type="button" class="reminder-day-chip" data-day="1" aria-pressed="true">月</button>
                                    <button type="button" class="reminder-day-chip" data-day="2" aria-pressed="true">火</button>
                                    <button type="button" class="reminder-day-chip" data-day="3" aria-pressed="true">水</button>
                                    <button type="button" class="reminder-day-chip" data-day="4" aria-pressed="true">木</button>
                                    <button type="button" class="reminder-day-chip" data-day="5" aria-pressed="true">金</button>
                                    <button type="button" class="reminder-day-chip" data-day="6" aria-pressed="true">土</button>
                                </div>
                            </div>
                        </div>

                        <p class="data-manage-note" id="reminderStatusNote"></p>
                        <p class="data-manage-note reminder-permission-note" id="reminderPermissionNote"></p>

                        <div class="data-manage-actions">
                            <button id="reminderTestBtn" class="reply-btn" type="button">
                                <span class="btn-icon">🔔</span><span class="btn-text">テスト通知を送る</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== BOTTOM NAV ===== -->
        <nav class="bottom-nav" aria-label="メインナビゲーション">
            <button class="nav-tab active" id="navChat" type="button">
                <svg class="icon-outline" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8c-1.1 0-2.1-.2-3-.6L4 21l1.7-4.5C4.6 15 4 13.6 4 12z"
                        stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                </svg>
                <svg class="icon-filled" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8c-1.1 0-2.1-.2-3-.6L4 21l1.7-4.5C4.6 15 4 13.6 4 12z"
                        fill="currentColor"></path>
                </svg>
                <span>チャット</span>
            </button>
            <button class="nav-tab" id="navHistory" type="button">
                <svg class="icon-outline" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"></rect>
                    <path d="M16 3v4M8 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M7 11h10M7 15h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <svg class="icon-filled" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="5" width="18" height="16" rx="2" fill="currentColor"></rect>
                    <path d="M16 3v4M8 3v4" stroke="var(--bg-panel)" stroke-width="1.6" stroke-linecap="round"></path>
                    <rect x="6" y="10.5" width="12" height="7.5" rx="1" fill="var(--bg-panel)"></rect>
                </svg>
                <span>履歴</span>
            </button>
            <button class="nav-tab" id="navRanking" type="button">
                <svg class="icon-outline" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 4h8v6a4 4 0 01-8 0V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                    <path d="M8 6H5a1 1 0 00-1 1v1a3 3 0 003 3M16 6h3a1 1 0 011 1v1a3 3 0 01-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                    <path d="M12 14v3M9 20h6M10 17h4v3h-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                </svg>
                <svg class="icon-filled" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 4h8v6a4 4 0 01-8 0V4z" fill="currentColor"></path>
                    <path d="M8 6H5a1 1 0 00-1 1v1a3 3 0 003 3M16 6h3a1 1 0 011 1v1a3 3 0 01-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
                    <path d="M12 14v3M9 20h6M10 17h4v3h-4z" fill="currentColor"></path>
                </svg>
                <span>ランキング</span>
            </button>
            <button class="nav-tab" id="navAchievements" type="button">
                <svg class="icon-outline" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="9" r="6" stroke="currentColor" stroke-width="1.6"></circle>
                    <path d="M9 14.5L7 21l5-3 5 3-2-6.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                </svg>
                <svg class="icon-filled" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 14.5L7 21l5-3 5 3-2-6.5" fill="currentColor"></path>
                    <circle cx="12" cy="9" r="6" fill="currentColor"></circle>
                </svg>
                <span>認定証</span>

            </button>
        </nav>

        <!-- ===== 📊 診断結果 MODAL（Q&Aが終わったらここだけモーダルで出す） ===== -->
        <div id="resultOverlay" class="modal-overlay" aria-hidden="true">
            <div class="modal result-modal" role="dialog" aria-modal="true" aria-labelledby="resultModalTitle">
                <div class="modal-handle"></div>
                <div class="modal-head">
                    <h2 id="resultModalTitle" class="modal-title">AI 診断結果</h2>
                    <button id="resultClose" class="modal-close" aria-label="閉じる" type="button">✕</button>
                </div>
                <div id="resultModalBody" class="result-modal-body"></div>
            </div>
        </div>

        <!-- ===== 📆 過去の日の詳細 MODAL（カレンダーから日付タップ時） ===== -->
        <div id="dayDetailOverlay" class="modal-overlay" aria-hidden="true">
            <div class="modal day-detail-modal" role="dialog" aria-modal="true" aria-labelledby="dayDetailTitle">
                <div class="modal-handle"></div>
                <div class="modal-head">
                    <h2 id="dayDetailTitle" class="modal-title">-</h2>
                    <button id="dayDetailClose" class="modal-close" aria-label="閉じる" type="button">✕</button>
                </div>
                <div id="dayDetailBody" class="result-modal-body"></div>
            </div>
        </div>

        <!-- ===== ⚡ クイック記録 MODAL ===== -->
        <div id="quickLogOverlay" class="modal-overlay" aria-hidden="true">
            <div class="modal quicklog-modal" role="dialog" aria-modal="true" aria-labelledby="quickLogTitle">
                <div class="modal-handle"></div>
                <div class="modal-head">
                    <h2 id="quickLogTitle" class="modal-title">⚡ クイック記録</h2>
                    <button id="quickLogClose" class="modal-close" aria-label="閉じる" type="button">✕</button>
                </div>
                <p class="quicklog-note">今日やったことにチェックするだけ。約10秒で記録できるよ。</p>
                <div id="quickLogList" class="quicklog-list"></div>
                <button id="quickLogSubmit" class="reply-btn restart" type="button">
                    <span class="btn-icon">✅</span><span class="btn-text">記録する</span>
                </button>
            </div>
        </div>

    </div>

    <script src="javascript/state.js"></script>
    <script src="javascript/data.js"></script>
    <script src="javascript/quiz.js"></script>
    <script src="javascript/gamify.js"></script>
    <script src="javascript/realworld.js"></script>
    <script src="javascript/cost.js"></script>
    <script src="javascript/commute.js"></script>
    <script src="javascript/quicklog.js"></script>
    <script src="javascript/monthlygoal.js"></script>
    <script src="javascript/reminder.js"></script>
    <script src="javascript/chat.js"></script>
    <script src="javascript/modals.js"></script>
    <script src="javascript/flow.js"></script>
    <script src="javascript/main.js"></script>
</body>

</html>
